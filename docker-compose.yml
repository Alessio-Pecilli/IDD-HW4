# Elasticsearch 9.5.0 single node (from github.com/tteofili/lucenex es/), heap reduced to fit a laptop.
# Kibana is optional: docker compose --profile kibana up -d
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: wikinews-es
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx2g
      - xpack.security.enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.0
    profiles: [kibana]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - 5601:5601
    depends_on: [elasticsearch]

volumes:
  esdata:
